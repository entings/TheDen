- type: emoteSounds
  id: AnimalSlime
  sounds:
    Squish:
      collection: Squishes
    Bubble:
      collection: Bubbles
    Pop:
      collection: Pops
    CatMeow:
      collection: CatMeows
    CatHisses:
      collection: CatHisses
    MonkeyScreeches:
      collection: MonkeyScreeches
    RobotBeep:
      collection: RobotBeeps
    Honk:
      collection: BikeHorn
    Weh:
      collection: Weh
  params:
    variation: 0.125

- type: emoteSounds
  id: ArachnidBodyEmotes
  sounds:
    Clap:
      collection: Claps
    ClapSingle:
      collection: ClapSingle
    Snap:
      collection: Snaps
      params:
        volume: -6
    Salute:
      collection: Salutes
    Crack:
      collection: Cracks
    Blink:
      collection: SpiderBlinks
      params:
        volume: -3
        variation: 0.1

- type: emoteSounds
  id: ArachnidSmall
  params:
    pitch: 1.5
    variation: 0.125
  sounds:
    Blink:
      collection: SpiderBlinks
      params:
        volume: -3
        variation: 0.1
    Scream:
      path: /Audio/Voice/Arachnid/arachnid_scream.ogg
    Laugh:
      path: /Audio/Voice/Arachnid/arachnid_laugh.ogg
    Chitter:
      path: /Audio/Voice/Arachnid/arachnid_chitter.ogg
    Click:
      path: /Audio/Voice/Arachnid/arachnid_click.ogg
    Hiss: #imp
      path: /Audio/_Impstation/Voice/Arachnid/arachnid_hiss.ogg
    Cough: #imp
      path: /Audio/_Impstation/Voice/Arachnid/arachnid_cough.ogg
    Yawn: #imp
      path: /Audio/_Impstation/Voice/Arachnid/arachnid_yawn.ogg
    Sigh: #imp
      path: /Audio/_Impstation/Voice/Arachnid/arachnid_sigh.ogg
    Crying: #imp
      path: /Audio/_Impstation/Voice/Arachnid/arachnid_cry.ogg
    Gasp: #imp
      path: /Audio/_Impstation/Voice/Arachnid/arachnid_gasp.ogg
